<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rangoli medallion, drawn in the same fine gold line as the rest of the
       stationery. Used behind the monogram on the loading curtain and behind
       the couple's names. Rotationally symmetric, so it can spin slowly
       without ever looking like it has a "top". -->
  <title>Rangoli medallion</title>

  <defs>
    <path id="rg-petal" d="M100 22 C114 44 114 64 100 82 C86 64 86 44 100 22 Z" />
    <path id="rg-leaf"  d="M100 88 C107 100 107 112 100 122 C93 112 93 100 100 88 Z" />
  </defs>

  <g fill="none" stroke="#c99a3e" stroke-width="1.4" stroke-linejoin="round">
    <circle cx="100" cy="100" r="92" stroke-width="1" opacity=".55" />
    <circle cx="100" cy="100" r="84" />
    <circle cx="100" cy="100" r="76" stroke-width="1" stroke-dasharray="1.5 7" opacity=".8" />
    <circle cx="100" cy="100" r="40" />
    <circle cx="100" cy="100" r="13" />

    <!-- outer ring of twelve petals -->
    <use href="#rg-petal" />
    <use href="#rg-petal" transform="rotate(30 100 100)" />
    <use href="#rg-petal" transform="rotate(60 100 100)" />
    <use href="#rg-petal" transform="rotate(90 100 100)" />
    <use href="#rg-petal" transform="rotate(120 100 100)" />
    <use href="#rg-petal" transform="rotate(150 100 100)" />
    <use href="#rg-petal" transform="rotate(180 100 100)" />
    <use href="#rg-petal" transform="rotate(210 100 100)" />
    <use href="#rg-petal" transform="rotate(240 100 100)" />
    <use href="#rg-petal" transform="rotate(270 100 100)" />
    <use href="#rg-petal" transform="rotate(300 100 100)" />
    <use href="#rg-petal" transform="rotate(330 100 100)" />

    <!-- inner ring of eight, offset so it reads through the outer one -->
    <g opacity=".85">
      <use href="#rg-leaf" transform="rotate(22.5 100 100)" />
      <use href="#rg-leaf" transform="rotate(67.5 100 100)" />
      <use href="#rg-leaf" transform="rotate(112.5 100 100)" />
      <use href="#rg-leaf" transform="rotate(157.5 100 100)" />
      <use href="#rg-leaf" transform="rotate(202.5 100 100)" />
      <use href="#rg-leaf" transform="rotate(247.5 100 100)" />
      <use href="#rg-leaf" transform="rotate(292.5 100 100)" />
      <use href="#rg-leaf" transform="rotate(337.5 100 100)" />
    </g>
  </g>

  <!-- dots on the twelve outer points, the way a rangoli is pricked out -->
  <g fill="#c99a3e" opacity=".9">
    <circle cx="100" cy="8" r="2.2" />
    <circle cx="146" cy="20.3" r="2.2" />
    <circle cx="179.7" cy="54" r="2.2" />
    <circle cx="192" cy="100" r="2.2" />
    <circle cx="179.7" cy="146" r="2.2" />
    <circle cx="146" cy="179.7" r="2.2" />
    <circle cx="100" cy="192" r="2.2" />
    <circle cx="54" cy="179.7" r="2.2" />
    <circle cx="20.3" cy="146" r="2.2" />
    <circle cx="8" cy="100" r="2.2" />
    <circle cx="20.3" cy="54" r="2.2" />
    <circle cx="54" cy="20.3" r="2.2" />
  </g>
</svg>
